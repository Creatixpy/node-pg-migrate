name: Coverage Report

on:
  workflow_run:
    workflows: ['Coverage']
    types:
      - completed

jobs:
  report:
    runs-on: ubuntu-latest

    permissions:
      # Required to put a comment into the pull-request
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download Artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}
          name: coverage-${{ github.event.workflow_run.id }}
          path: coverage

      - name: Download main Artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}
          name: coverage-main
          path: coverage-main

      # Associated pull requests can include other repositories sharing the branch.
      - name: Select the fork pull request
        if: github.repository == 'Creatixpy/node-pg-migrate' && github.event.workflow_run.event == 'pull_request'
        id: fork-pull-request
        run: |
          python3 - <<'PY'
          import json
          import os

          with open(os.environ['GITHUB_EVENT_PATH'], encoding='utf-8') as event_file:
              event = json.load(event_file)

          workflow_run = event['workflow_run']
          repository_id = event['repository']['id']
          pull_requests = [
              pull_request
              for pull_request in workflow_run['pull_requests']
              if pull_request['base']['repo']['id'] == repository_id
              and pull_request['head']['repo']['id'] == repository_id
              and pull_request['head']['sha'] == workflow_run['head_sha']
              and pull_request['head']['ref'] == workflow_run['head_branch']
          ]

          if len(pull_requests) != 1:
              raise SystemExit('Expected exactly one matching pull request in the fork')

          pull_request_number = pull_requests[0]['number']
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output_file:
              output_file.write(f'number={pull_request_number}\n')
          print(f'Selected pull request {pull_request_number} in the fork')
          PY

      - name: Report Coverage
        uses: davelosert/vitest-coverage-report-action@c4bbc33a89b7ace0e63d35f1f7d4bcee31155a73 # v2.13.0
        with:
          file-coverage-mode: all
          json-summary-compare-path: coverage-main/coverage-summary.json
          pr-number: ${{ steps.fork-pull-request.outputs.number }}
